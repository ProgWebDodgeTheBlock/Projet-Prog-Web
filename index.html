<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Pour que le site s'affiche bien sur mobile, même s'il n'est pas fait pour être joué sur mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dodge The Blocks</title>
    
    <!-- Feuille de styles CSS -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h1 class="texte-centré">Dodge The Blocks</h1>
    
    <main>
        <!-- zone du milieu haut -->
        <section id="zone-milieu-haut">
            <!-- zone de description du jeu -->
            <section id="zone-description">
                <p id="text-description-jeu">Bienvenue dans Dodge The blocks ! Ce jeu vous permet de faire...</p>
            </section>


            <!-- La zone de jeu -->
            <section id="zone-jeu">
                <button id="bouton-start">Start</button>
            </section>


            <!-- zone de gestion des paramètres de jeu (difficulté, changer de joueur..) -->
            <section id="zone-paramètres">
                <!-- section du bouton de difficulté -->
                <section id="zone-bouton-difficulté">
                    <button id="bouton-difficulté-moins">-</button>
                    <p id="texte-difficulté" class="texte-centré">Difficulté</p>
                    <button id="bouton-difficulté-plus">+</button>
                </section>

                <button id="bouton-changer-joueur">Changer de joueur</button>
            </section>
        </section>

        <!-- zone du milieu bas -->
        <section id="zone-milieu-bas">
            <!-- Zone d'explication des contrôles du joueur et des bonus/malus -->
            <section id="zone-contrôles">
                <section class="explication-touches">
                    <!-- Image touches directionnelles -->
                    <img src="Images/touches directionnelles clavier.jpg" alt="Touches directionnelles clavier" width="100">
                    <p class="description-image">Vous pouvez vous déplacer à l'aides des touches directionnelles</p>
                </section>
            </section>


            <!-- Zone du classement -->
            <section id="zone-classement">
                <!-- Table du classement -->
                <table>
                    <thead>
                        <tr>
                            <th>Classement</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </section>
            
        </section>

    </main>

    <!-- Script JavaScript -->
    <script src="script.js" defer></script>
</body>
</html>
